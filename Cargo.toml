[workspace]
resolver = "2"
# Crates join the workspace as they are built. An empty stub that does not
# compile would make `cargo test` red for a reason that is not a real failure.
members = [
    "crates/proto",
    "crates/auth",
    "crates/core",
    "crates/engine",
    "crates/api",
    "crates/persist",
    "crates/ws",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"

[workspace.dependencies]
cex-proto = { path = "crates/proto" }
cex-core = { path = "crates/core" }
cex-auth = { path = "crates/auth" }
cex-persist = { path = "crates/persist" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
tokio = { version = "1", features = ["full"] }
redis = { version = "0.27", features = ["tokio-comp", "streams"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
tempfile = "3"

# Argon2 is memory-hard by design, which makes it ~100x slower when built
# unoptimised — 45 seconds for a handful of tests. Optimise just the hashing
# crates so debug builds stay fast without touching anything else.
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3
[profile.dev.package.password-hash]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
