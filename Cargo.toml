[workspace]
resolver = "2"
# Crates join the workspace as they are built. An empty stub that does not
# compile would make `cargo test` red for a reason that is not a real failure.
members = [
    "crates/proto",
    "crates/core",
    "crates/engine",
    "crates/api",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"

[workspace.dependencies]
cex-proto = { path = "crates/proto" }
cex-core = { path = "crates/core" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
tokio = { version = "1", features = ["full"] }
redis = { version = "0.27", features = ["tokio-comp", "streams"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
