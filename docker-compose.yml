services:
  redis:
    image: redis:7-alpine
    container_name: cex-redis
    # Non-default port so this never collides with another local Redis.
    ports:
      - "6390:6379"
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  postgres:
    image: postgres:16-alpine
    container_name: cex-postgres
    ports:
      - "5442:5432"
    environment:
      POSTGRES_USER: cex
      POSTGRES_PASSWORD: cex
      POSTGRES_DB: cex
    volumes:
      - cex-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cex"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  cex-pgdata:
