[package]
name = "cex-loadgen"
version.workspace = true
edition.workspace = true

# A development tool. It is a workspace member so it compiles and is tested in
# CI, and it is deliberately absent from Dockerfile — the deployed image builds
# four binaries and this is not one of them.

# Split into lib + bin, matching cex-api/engine/persist/ws: report.rs's items
# are only exercised by unit tests and (starting Task 7) the driver, not by
# `main` itself. As a bin-only crate that would make them dead code under
# `-D warnings`; as a lib's public API they are not.
[lib]
name = "cex_loadgen"
path = "src/lib.rs"

[[bin]]
name = "loadgen"
path = "src/main.rs"

# Same crate because it needs the same three things the driver already has —
# register, fund, place — and a second crate would only duplicate them. Also
# absent from Dockerfile: it drives a deployed exchange from outside, it is not
# part of one.
[[bin]]
name = "demo-maker"
path = "src/bin/demo-maker.rs"

[dependencies]
cex-proto.workspace = true
cex-ws = { path = "../ws" }
hdrhistogram = "7"
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
uuid.workspace = true
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls"] }
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-native-roots"] }
futures-util = "0.3.34"
clap = { version = "4.6.6", features = ["derive"] }
