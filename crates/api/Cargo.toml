[package]
name = "cex-api"
version.workspace = true
edition.workspace = true

[[bin]]
name = "api"
path = "src/main.rs"

[lib]
name = "cex_api"
path = "src/lib.rs"

[dependencies]
cex-proto.workspace = true
cex-auth.workspace = true
# The history tables are defined and written by `persist`; reading them through
# the same type keeps one definition of the schema rather than two.
cex-persist = { path = "../persist" }
anyhow.workspace = true
futures-util = "0.3"
redis.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true
# sqlx 0.9 split the old `runtime-tokio-rustls` feature into a runtime
# and a TLS backend chosen separately.
sqlx = { version = "0.9", default-features = false, features = ["postgres", "runtime-tokio", "tls-rustls-ring", "uuid", "macros"] }
argon2 = { version = "0.5.3", features = ["std"] }
# `getrandom` gives password_hash an OS random source for salts.
password-hash = { version = "0.5", features = ["rand_core"] }
rand_core = { version = "0.6", features = ["getrandom"] }
axum = "0.8.9"
tower-http = { version = "0.7.0", features = ["cors", "trace"] }

[dev-dependencies]
base64 = "0.23.1"
# The tests drive a real engine so the loopback is exercised end to end
# rather than against a mock that cannot disagree with reality.
cex-engine = { path = "../engine" }
http-body-util = "0.1.4"
tempfile.workspace = true
tower = "0.5.3"
