<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="Architecture: a client calls the API, which appends commands to a Redis stream; the engine reads them, applies them to in-memory state, writes events to a second Redis stream and replies to the API; the websocket server and persister both read the event stream; the engine periodically writes snapshots.">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#7c8b99"/>
    </marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#12836f"/>
    </marker>
  </defs>

  <style>
    .bx   { fill:#8892a01a; stroke:#7c8b99; stroke-width:1.5 }
    .live { fill:#12836f22; stroke:#12836f; stroke-width:2 }
    .ln   { stroke:#7c8b99; stroke-width:1.5; fill:none }
    .lng  { stroke:#12836f; stroke-width:2; fill:none }
    .dash { stroke:#7c8b99; stroke-width:1.4; fill:none; stroke-dasharray:5 4 }
    .t    { fill:#8892a0; font-family:ui-monospace,Menlo,Consolas,monospace; font-size:13px }
    .s    { fill:#7c8b99; font-family:ui-monospace,Menlo,Consolas,monospace; font-size:10.5px }
    .g    { fill:#12836f; font-family:ui-monospace,Menlo,Consolas,monospace; font-size:13px }
  </style>

  <rect class="bx" x="30" y="40" width="130" height="62" rx="4"/>
  <text class="t" x="95" y="66" text-anchor="middle">Client</text>
  <text class="s" x="95" y="84" text-anchor="middle">web / bot / curl</text>

  <rect class="live" x="250" y="40" width="140" height="62" rx="4"/>
  <text class="g" x="320" y="66" text-anchor="middle">API</text>
  <text class="s" x="320" y="84" text-anchor="middle">REST + auth</text>

  <rect class="bx" x="470" y="40" width="170" height="62" rx="4"/>
  <text class="t" x="555" y="64" text-anchor="middle">cex:commands</text>
  <text class="s" x="555" y="82" text-anchor="middle">Redis stream · durable</text>

  <rect class="live" x="720" y="30" width="200" height="120" rx="4"/>
  <text class="g" x="820" y="60" text-anchor="middle">Engine</text>
  <text class="s" x="820" y="80" text-anchor="middle">order book, balances</text>
  <text class="s" x="820" y="96" text-anchor="middle">all in memory</text>
  <text class="s" x="820" y="118" text-anchor="middle">single thread</text>
  <text class="s" x="820" y="134" text-anchor="middle">no clock, no sockets</text>

  <rect class="live" x="720" y="200" width="200" height="56" rx="4"/>
  <text class="g" x="820" y="224" text-anchor="middle">Snapshots</text>
  <text class="s" x="820" y="242" text-anchor="middle">state + stream position</text>

  <rect class="bx" x="470" y="250" width="170" height="62" rx="4"/>
  <text class="t" x="555" y="274" text-anchor="middle">cex:events</text>
  <text class="s" x="555" y="292" text-anchor="middle">Redis stream · durable</text>

  <rect class="live" x="250" y="210" width="140" height="58" rx="4"/>
  <text class="t" x="320" y="234" text-anchor="middle">WS server</text>
  <text class="s" x="320" y="252" text-anchor="middle">market data fan-out</text>

  <rect class="live" x="250" y="330" width="140" height="58" rx="4"/>
  <text class="t" x="320" y="354" text-anchor="middle">Persister</text>
  <text class="s" x="320" y="372" text-anchor="middle">events → postgres</text>

  <rect class="bx" x="30" y="330" width="130" height="58" rx="4"/>
  <text class="t" x="95" y="354" text-anchor="middle">Postgres</text>
  <text class="s" x="95" y="372" text-anchor="middle">users, history</text>

  <line class="ln" x1="160" y1="71" x2="243" y2="71" marker-end="url(#a)"/>
  <text class="s" x="201" y="62" text-anchor="middle">HTTP</text>

  <line class="lng" x1="390" y1="71" x2="463" y2="71" marker-end="url(#ag)"/>
  <text class="s" x="426" y="62" text-anchor="middle">XADD</text>

  <line class="lng" x1="640" y1="71" x2="713" y2="71" marker-end="url(#ag)"/>
  <text class="s" x="676" y="62" text-anchor="middle">XREAD</text>

  <line class="ln" x1="820" y1="150" x2="820" y2="193" marker-end="url(#a)"/>
  <text class="s" x="830" y="177">every N</text>

  <polyline class="lng" points="720,120 678,120 678,281 647,281" marker-end="url(#ag)"/>
  <text class="s" x="668" y="205" text-anchor="end">XADD events</text>

  <polyline class="lng" points="470,268 430,268 430,239 397,239" marker-end="url(#ag)"/>
  <text class="s" x="424" y="222" text-anchor="end">group A</text>

  <polyline class="lng" points="470,295 430,295 430,359 397,359" marker-end="url(#ag)"/>
  <text class="s" x="424" y="380" text-anchor="end">group B</text>

  <line class="lng" x1="250" y1="359" x2="167" y2="359" marker-end="url(#ag)"/>
  <text class="s" x="208" y="350" text-anchor="middle">one txn</text>

  <polyline class="lng" points="250,239 200,239 200,88 167,88" marker-end="url(#ag)"/>
  <text class="s" x="192" y="205" text-anchor="end">push</text>

  <polyline class="dash" points="820,30 820,12 320,12 320,33" marker-end="url(#a)"/>
  <text class="s" x="570" y="26" text-anchor="middle">reply, matched on request_id</text>

  <polyline class="dash" points="320,102 320,160 95,160 95,323" marker-end="url(#a)"/>
  <text class="s" x="150" y="152" text-anchor="middle">auth lookup</text>

  <rect class="live" x="30" y="450" width="26" height="16" rx="2"/>
  <text class="s" x="64" y="462">built</text>
  <rect class="bx" x="140" y="450" width="26" height="16" rx="2"/>
  <text class="s" x="174" y="462">infrastructure</text>
</svg>
